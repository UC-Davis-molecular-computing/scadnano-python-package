name: "release"

# On every push to main: tag v{version}, create a GitHub release whose body
# lists commits since the previous release, and publish to PyPI.
#
# Issues are not touched here. main is the default branch, so GitHub itself
# closes any issue referenced by a closing keyword in the commits this push
# brings to main, and records the closing commit on the issue.
#
# INVARIANT: every push to main is a release. If the version in pyproject.toml
# was not bumped, this workflow FAILS (red X) on purpose.
#
# NEVER substitute a personal access token (PAT) for GITHUB_TOKEN below.
# Actions taken with GITHUB_TOKEN do not trigger other workflows, and the
# release created here depends on that: it must not trigger changelog.yml,
# because at creation time its title is still the "TODO" placeholder.

on:
  push:
    branches:
      - "main"

# Serialize runs so two quick merges to main cannot interleave tag creation or
# PyPI publishing. Queued, not cancelled: every push must produce (or loudly
# fail to produce) a release.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: "Create GitHub release"
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the vX.Y.Z tag and the release
    env:
      GH_TOKEN: ${{ github.token }}   # gh CLI reads this; do NOT replace with a PAT
    outputs:
      version: ${{ steps.version.outputs.version }}
      prev_ref: ${{ steps.prev.outputs.prev_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history + all tags, needed for `git log <prev>..HEAD`

      - name: Extract version from pyproject.toml
        id: version
        run: |
          # Parsed with tomllib rather than a regex so that comments, quoting
          # style and key order in pyproject.toml cannot silently change the
          # answer. tomllib is stdlib from 3.11; the runner image ships newer.
          version=$(python3 -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=pyproject.toml::could not extract a semantic version from [project] version (got: '$version')"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Fail loudly if version was not bumped (unless this is a re-run)
        id: guard
        run: |
          version='${{ steps.version.outputs.version }}'
          if git rev-parse -q --verify "refs/tags/v$version^{commit}" > /dev/null; then
            tag_commit=$(git rev-parse "refs/tags/v$version^{commit}")
            if [ "$tag_commit" = "$GITHUB_SHA" ]; then
              echo "Tag v$version already exists at this exact commit: re-run of a partially failed workflow. Skipping release creation."
              echo "create_release=false" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Tag v$version already exists (at $tag_commit) but this push is $GITHUB_SHA. The version in pyproject.toml was not bumped before merging to main. Bump it on dev and merge dev to main again (see CONTRIBUTING.md); this red X is the intended reminder."
              exit 1
            fi
          else
            echo "create_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine previous release tag
        id: prev
        run: |
          version='${{ steps.version.outputs.version }}'
          # Newest published, non-draft, non-prerelease release, excluding the
          # release this run creates (matters on re-runs). Empty if none exists.
          prev_ref=$(gh release list --exclude-drafts --exclude-pre-releases \
            --limit 20 --json tagName \
            --jq "[.[].tagName] | map(select(. != \"v$version\")) | first // empty")
          echo "prev_ref=$prev_ref" >> "$GITHUB_OUTPUT"

      # The commit list is built here with `git log` rather than with GitHub's
      # own `gh release create --generate-notes`. Do not "simplify" this to
      # --generate-notes: that generator is PR-based only. It lists the titles
      # of merged pull requests and silently omits commits pushed directly to a
      # branch, of which this repo has many. Losing those from the release notes
      # is the regression this workflow was written to avoid.
      - name: Create release with commit list since previous release
        if: steps.guard.outputs.create_release == 'true'
        run: |
          version='${{ steps.version.outputs.version }}'
          prev_ref='${{ steps.prev.outputs.prev_ref }}'
          if [ -n "$prev_ref" ]; then range="$prev_ref..HEAD"; else range="HEAD"; fi
          {
            echo "TODO: describe this release here, then retitle the release to \"v$version\"."
            echo
            echo "## Commits"
            echo
            git log --format='- %h: %s (%an)' "$range"
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "v$version" \
            --target "$GITHUB_SHA" \
            --title "TODO: edit release notes for v$version" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            LICENSE.txt

  publish:
    name: "Publish to PyPI"
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read    # actions/checkout
      id-token: write   # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build package
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Without this, re-running the workflow after a partial failure aborts
          # here, because PyPI rejects a duplicate file upload. That would
          # contradict the re-run guard in the release job. `python -m build`
          # produces deterministic filenames, so a re-run's artifacts match what
          # is already on PyPI and are correctly skipped.
          skip-existing: true

          # Nothing acts on issues after the release. main is the default branch,
          # so GitHub itself closes any issue referenced by a closing keyword in
          # the commits this push brings to main, and records the closing commit
          # on the issue. The "closed in dev" label added by label-fixed-in-dev.yml
          # is left in place; `is:open label:"closed in dev"` still finds exactly
          # the fixes that are merged but not yet released, because released ones
          # are closed.
