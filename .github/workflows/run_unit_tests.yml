name: Run Unit Tests

on: pull_request

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]

    steps:
      - uses: actions/checkout@v7
      # the runner image ships only one Python on PATH; this is what actually selects the version
      # named by the matrix (all of 3.10-3.14 are in the runner's tool cache, so it is a fast lookup)
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install openpyxl,tabulate with pip
        run: pip install openpyxl tabulate
      - name: Test with unittest
        run: python -m unittest -v tests/scadnano_tests.py
